<div class="relative overflow-x-auto shadow-md sm:rounded-lg px-5 md:px-10 m-4">
  <div class="z-5 fixed top-16 bg-base-100 w-full px-5 md:px-10 py-4">
    <h1 class="text-xs md:text-2xl font-semibold mb-2">Listar Ventas</h1>
    <button class="btn btn-outline btn-accent" onclick="my_modal_1.showModal()">
      crear nueve venta
    </button>
  </div>
  <app-header-select-ventas (idTipoVenta)="listaVenta($event)" />
  @if (handleCalendar()) {
    <div class="mt-5">
      <button
        popovertarget="cally-popover1"
        class="input input-border"
        id="cally1"
        style="anchor-name: --cally1"
      >
        Seleccionar rango de fecha
      </button>
      <div
        popover
        id="cally-popover1"
        class="dropdown bg-base-100 rounded-box shadow-lg"
        style="position-anchor: --cally1"
      >
        <calendar-range #calendarRange months="1" (change)="onRangeChange()">
          <calendar-month></calendar-month>
          <calendar-month offset="1"></calendar-month>
        </calendar-range>
      </div>
    </div>
  }
  <!-- <button class="btn btn-accent" (click)="searchDetalleVenta()">Accent</button> -->
</div>

<h3 class="text-lg font-bold text-center">Realizar Corte</h3>
<p class="py-4 text-center">Introduce observaciones separadas por comas y guarda.</p>
@if (checkNextForm()) {
  <div class="max-w-180 md:m-auto m-2">
    <form class="mt-4 w-full" autocomplete="off" [formGroup]="myForm" (ngSubmit)="onSave()">
      <div class="mt-5">
        <label
          for="rest"
          class="block mb-2 text-sm font-medium"
          [ngClass]="{
            ' text-red-700 dark:text-red-500': formUtils.isValiedField(myForm, 'fechaSalida'),
          }"
          >Fecha Corte*</label
        >
        <input
          type="date"
          id="fechaSalida"
          formControlName="fechaSalida"
          class="border text-sm input-md input rounded-lg block w-full p-2.5"
        />
      </div>
      <div class="mt-5">
        <label
          for="rest"
          class="block mb-2 text-sm font-medium"
          [ngClass]="{
            ' text-red-700 dark:text-red-500': formUtils.isValiedField(myForm, 'rest'),
          }"
          >Total a Restar*</label
        >
        <input
          type="number"
          id="rest"
          formControlName="rest"
          class="border text-sm input-md input rounded-lg block w-full p-2.5"
        />
      </div>
      <div class="mt-5">
        <label
          for="sum"
          class="block mb-2 text-sm font-medium"
          [ngClass]="{
            ' text-red-700 dark:text-red-500': formUtils.isValiedField(myForm, 'sum'),
          }"
          >Total a Sumar*</label
        >
        <input
          type="number"
          id="sum"
          formControlName="sum"
          class="border text-sm input-md input rounded-lg block w-full p-2.5"
        />
      </div>

      <div class="my-4">
        <label for="obs" class="block mb-2 text-sm font-medium">Descripción</label>
        <textarea
          id="obs"
          class="textarea block w-full"
          formControlName="obs"
          placeholder="Observaciones separados por comas"
        ></textarea>
      </div>

      <div class="md:flex md:justify-end">
        <button
          type="button"
          class="btn btn-active font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center mr-2 mb-2 md:mb-0"
        >
          Salir
        </button>
        <button
          type="submit"
          [disabled]="!myForm.valid"
          class="text-white bg-accent focus:ring-4 focus:outline-none font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center"
          ngClass="disabled:bg-accent/40 disabled:cursor-not-allowed"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
}
@if (!checkNextForm() && turno()) {
  <app-medidas [idturno]="turno()!.idTurno" />
}
